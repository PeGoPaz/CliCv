<!DOCTYPE html>
<!-- Source for assets/og.png (the social-preview card). Rebuild with:
     npm run og      -->
<html lang="en">
<head><meta charset="utf-8"><style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:1200px; height:630px; }
  body {
    display:flex; flex-direction:column; justify-content:center;
    padding:0 84px; background:#0a0e14; color:#cdd6f4;
    font-family:"JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  .chrome { position:absolute; top:0; left:0; right:0; height:56px;
    background:#1a1f2e; border-bottom:1px solid #1e2330;
    display:flex; align-items:center; justify-content:center;
    font-size:20px; color:#7f849c; letter-spacing:1px; }
  .prompt { font-size:30px; color:#f38ba8; margin-bottom:26px; letter-spacing:1px; }
  .prompt .cmd { color:#89dceb; }
  h1 { font-size:88px; font-weight:700; line-height:1.05; color:#89dceb;
       letter-spacing:-1px; }
  .role { font-size:40px; margin-top:24px; color:#cdd6f4; }
  .meta { font-size:26px; margin-top:40px; color:#7f849c; letter-spacing:0.5px; }
  .rule { width:132px; height:5px; background:#89dceb; margin-top:36px; border-radius:3px; }
  .url { position:absolute; bottom:44px; right:84px; font-size:26px; color:#89b4fa; }
</style></head>
<body>
  <div class="chrome">guest@portfolio — zsh</div>
  <div class="prompt">guest@portfolio:~ &#10095; <span class="cmd">whoami</span></div>
  <h1>Vladimir Rainov</h1>
  <div class="role">Software Engineer</div>
  <div class="rule"></div>
  <div class="meta">Dublin, Ireland &nbsp;·&nbsp; Java · Python · SQL · Docker · AWS</div>
  <div class="url">vladr.tech</div>
</body>
</html>
